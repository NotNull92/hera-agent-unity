name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Generated runtime contract drift
        run: go run ./tools/generate-runtime-contracts --check

      - name: Agent guide drift
        run: go run ./tools/sync-agent-guides --check

      - name: Connector package integrity
        run: go run ./tools/validate-connector-package

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Distribution metadata and npm package
        working-directory: npm
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --dry-run

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

      - name: Format
        run: |
          golangci-lint fmt
          git diff --exit-code
