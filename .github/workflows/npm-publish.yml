name: Publish npm Package

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag matching npm/package.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ref="$MANUAL_TAG"
          else
            ref="$COMPLETED_SHA"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="v$(node -p "require('./npm/package.json').version")"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a stable vX.Y.Z tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install package metadata without postinstall download
        working-directory: npm
        run: npm ci --ignore-scripts

      - name: Verify package version and GitHub native assets
        working-directory: npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HERA_AGENT_UNITY_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "v${version}" != "$HERA_AGENT_UNITY_RELEASE_TAG" ]]; then
            echo "npm version ${version} does not match ${HERA_AGENT_UNITY_RELEASE_TAG}" >&2
            exit 1
          fi
          if npm view "hera-agent-unity@${version}" version >/dev/null 2>&1; then
            echo "hera-agent-unity@${version} is already published" >&2
            exit 1
          fi
          node scripts/verify-release.js

      - name: Test and inspect package
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run

      - name: Publish with npm trusted publishing
        working-directory: npm
        run: npm publish --access public
