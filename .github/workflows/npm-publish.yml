name: Publish npm Package

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag matching npm/package.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ref="$MANUAL_TAG"
          else
            ref="$COMPLETED_SHA"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # The tag comes from the release that triggered this run. Deriving it from
      # npm/package.json instead made every automatic run re-publish whatever
      # version that file happened to carry, so once the file stopped being
      # bumped the job failed with "already published" on every release and npm
      # silently stopped tracking the CLI.
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          TRIGGER_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$TRIGGER_REF"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a stable vX.Y.Z tag, got '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The published version follows the tag rather than a hand-maintained
      # field, so a forgotten bump can no longer stall the pipeline. The lock
      # file carries the version too, and `npm ci` refuses to run when the two
      # disagree, so both are rewritten together.
      - name: Pin package version to the release tag
        shell: bash
        env:
          HERA_AGENT_UNITY_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${HERA_AGENT_UNITY_RELEASE_TAG#v}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const newline = String.fromCharCode(10);
            const write = (file, data) =>
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + newline);

            const pkg = JSON.parse(fs.readFileSync("npm/package.json", "utf8"));
            pkg.version = version;
            write("npm/package.json", pkg);

            const lock = JSON.parse(fs.readFileSync("npm/package-lock.json", "utf8"));
            lock.version = version;
            if (lock.packages && lock.packages[""]) lock.packages[""].version = version;
            write("npm/package-lock.json", lock);

            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            server.version = version;
            for (const entry of server.packages || []) entry.version = version;
            write("server.json", server);
          ' "$version"
          echo "pinned to $(node -p "require('./npm/package.json').version")"

      - name: Install package metadata without postinstall download
        working-directory: npm
        run: npm ci --ignore-scripts

      - name: Verify package version and GitHub native assets
        working-directory: npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HERA_AGENT_UNITY_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "v${version}" != "$HERA_AGENT_UNITY_RELEASE_TAG" ]]; then
            echo "npm version ${version} does not match ${HERA_AGENT_UNITY_RELEASE_TAG}" >&2
            exit 1
          fi
          if npm view "hera-agent-unity@${version}" version >/dev/null 2>&1; then
            echo "hera-agent-unity@${version} is already published" >&2
            exit 1
          fi
          node scripts/verify-release.js

      - name: Test and inspect package
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run

      - name: Publish with npm trusted publishing
        working-directory: npm
        run: npm publish --access public
