name: Publish MCP Registry

on:
  workflow_run:
    workflows: ["Publish npm Package"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag matching server.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: "1.7.9"
      MCP_PUBLISHER_SHA256: "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"
    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ref=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$COMPLETED_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      # The npm run that triggers this reports head_branch main rather than the
      # release tag, because it was itself started by a workflow_run and GitHub
      # resolves that ref to the default branch. Only the first hop of the chain
      # sees the tag. The commit is exact either way, so read the tag off it.
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$(git tag --points-at HEAD --list 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a stable vX.Y.Z tag, got '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # server.json is what mcp-publisher reads, so it follows the release tag
      # for the same reason npm/package.json does.
      - name: Pin server metadata to the release tag
        shell: bash
        env:
          HERA_AGENT_UNITY_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${HERA_AGENT_UNITY_RELEASE_TAG#v}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const newline = String.fromCharCode(10);
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            server.version = version;
            for (const entry of server.packages || []) entry.version = version;
            fs.writeFileSync("server.json", JSON.stringify(server, null, 2) + newline);
          ' "$version"
          echo "pinned to $(node -p "require('./server.json').version")"

      - name: Verify registry metadata and npm publication
        shell: bash
        run: |
          npm --prefix npm ci --ignore-scripts
          npm --prefix npm test
          version="$(node -p "require('./server.json').version")"
          published="$(npm view "hera-agent-unity@${version}" version)"
          if [[ "$published" != "$version" ]]; then
            echo "hera-agent-unity@${version} is not available from npm" >&2
            exit 1
          fi

      - name: Install pinned mcp-publisher
        shell: bash
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          ./mcp-publisher --version

      - name: Validate server metadata
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish
